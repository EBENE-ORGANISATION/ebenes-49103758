name: Deploy web (Cloudflare Pages)

# Chaque push sur main recompile et déploie la version web.
# Prérequis (Settings → Secrets and variables → Actions) :
#   secrets : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variable : CF_PAGES_PROJECT (nom du projet Cloudflare Pages)
# Tant que CF_PAGES_PROJECT n'est pas défini, le déploiement est ignoré.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.CF_PAGES_PROJECT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Les variables VITE_SUPABASE_* viennent de .env.production (versionné exprès).
      - name: Build web
        run: npm run build

      - name: Deploy vers Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
