name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # Le runner ubuntu-latest embarque déjà l'Android SDK.
      # On installe uniquement les composants manquants via sdkmanager.
      - name: Install Android SDK components
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install JS dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        # `set -o pipefail` : un échec de gradlew doit faire échouer l'étape
        # (sinon masqué par un éventuel pipe). Retry auto x3 pour absorber les
        # pannes réseau transitoires (ex : Maven Central renvoyant 403).
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "==== Build APK — tentative $i/3 ===="
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              echo "Build APK réussi (tentative $i)."
              exit 0
            fi
            echo "Échec tentative $i. Nettoyage du cache et nouvelle tentative dans 20s…"
            ./gradlew --stop || true
            sleep 20
          done
          echo "::error::Build APK échoué après 3 tentatives."
          exit 1

      - name: List APK outputs
        if: always()
        run: ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "Dossier APK absent"

      - name: Sign APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$(ls -d $ANDROID_SDK_ROOT/build-tools/* 2>/dev/null | sort -V | tail -1)/apksigner
          echo "apksigner : $APKSIGNER"
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            APK_IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_IN=android/app/build/outputs/apk/release/app-release.apk
          else
            echo "❌ APK introuvable"
            exit 1
          fi
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/ebenes-signed.apk \
            "$APK_IN"
          echo "✅ Signé : ebenes-signed.apk"

      - name: Rename APK (sans keystore)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
               android/app/build/outputs/apk/release/ebenes-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               android/app/build/outputs/apk/release/ebenes-unsigned.apk
          else
            echo "❌ APK introuvable"
            exit 1
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "true"
          files: |
            android/app/build/outputs/apk/release/ebenes-signed.apk
            android/app/build/outputs/apk/release/ebenes-unsigned.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
