name: Release Android APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Force Node.js 24 pour éviter la dépréciation des actions Node.js 20
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          # Accepter toutes les licences automatiquement
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Installer SDK 36, build-tools 35 (compatibles AGP 8.x) et les outils nécessaires
          sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "cmdline-tools;latest" 2>&1 | tail -5

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.useAndroidX=true 2>&1 | tail -40

      - name: List APK outputs (debug)
        if: always()
        run: ls -la android/app/build/outputs/apk/release/ 2>/dev/null || echo "Dossier APK absent"

      - name: Sign APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          # Utilise la dernière version de build-tools disponible
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)/apksigner
          echo "apksigner: $APKSIGNER"
          # L'APK peut être app-release-unsigned.apk ou app-release.apk selon Gradle
          APK_IN=""
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            APK_IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK_IN=android/app/build/outputs/apk/release/app-release.apk
          else
            echo "❌ APK introuvable pour la signature"
            exit 1
          fi
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/ebenes-signed.apk \
            "$APK_IN"
          echo "✅ APK signé : ebenes-signed.apk"

      - name: Rename unsigned APK (fallback sans keystore)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
               android/app/build/outputs/apk/release/ebenes-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               android/app/build/outputs/apk/release/ebenes-unsigned.apk
          else
            echo "❌ Aucun APK trouvé"
            exit 1
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "true"
          files: |
            android/app/build/outputs/apk/release/ebenes-signed.apk
            android/app/build/outputs/apk/release/ebenes-unsigned.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
