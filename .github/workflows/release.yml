name: Release Windows Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish never : update.bat gère seul la release GitHub
        # Le CI sert uniquement à valider que le build passe sur un
        # environnement propre. L'upload est fait localement par update.bat
        # pour éviter la race condition (SHA512 incohérent si les deux
        # systèmes uploadent en même temps).
        run: npm run electron:build:win -- --publish never

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist-electron\*.exe" | Select-Object -First 1
          $yml = "dist-electron\latest.yml"
          if (-not $exe) { Write-Error "EXE manquant dans dist-electron"; exit 1 }
          if (-not (Test-Path $yml)) { Write-Error "latest.yml manquant"; exit 1 }
          $ver = if ((Get-Content $yml -Raw) -match '(?m)^version:\s*(\S+)') { $Matches[1] } else { '?' }
          Write-Host "Build OK : $($exe.Name) — version $ver"

      - name: Upload CI artifact (diagnostic uniquement)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-ci
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
          retention-days: 7
